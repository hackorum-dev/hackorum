version: "3.9"

# Bounded, gzip-compressed logging so no container can fill the disk.
# local driver rotates by size and compresses rotated files.
x-logging-verbose: &logging-verbose
  driver: local
  options:
    max-size: "250m"
    max-file: "100"
    compress: "true"

x-logging-default: &logging-default
  driver: local
  options:
    max-size: "20m"
    max-file: "15"
    compress: "true"

services:
  db:
    image: postgres:18
    logging: *logging-default
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackorum}
      UMAMI_DB: ${UMAMI_DB:-umami}
      UMAMI_DB_USER: ${UMAMI_DB_USER:-umami}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      # Postgres 18+ stores data under /var/lib/postgresql/<major>/main
      - pgdata:/var/lib/postgresql
      - pgdumps:/dumps
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro # copy from postgresql.conf.example
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf"
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hackorum}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 4g
    restart: unless-stopped
    labels:
      autoheal: "true"

  web:
    build: ..
    logging: *logging-verbose
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackorum}}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-hackorum}
      # Puma concurrency
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      # Run Solid Queue supervisor inside Puma so background jobs (emails, etc.) get processed.
      SOLID_QUEUE_IN_PUMA: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # Required: decrypts credentials.yml.enc, which holds the Active Record
      # encryption keys used for Identity OAuth tokens (Gmail send feature).
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      # Mail configuration
      APP_HOST: ${APP_HOST}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      autoheal: "true"

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0.0
    logging: *logging-default
    hostname: mail.hackorum.dev
    env_file: mail.env
    ports:
      - "25:25"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./dms/config:/tmp/docker-mailserver
      - caddy_data:/caddy-certs:ro
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss -lnt | grep -q ':25 ' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

  umami:
    image: ghcr.io/umami-software/umami:latest
    logging: *logging-default
    env_file: .env
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL:-postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@db:5432/${UMAMI_DB:-umami}}
      APP_SECRET: ${UMAMI_APP_SECRET}
      HASH_SALT: ${UMAMI_HASH_SALT}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    labels:
      autoheal: "true"

  imap_worker:
    build: ..
    logging: *logging-default
    command: ["bundle", "exec", "ruby", "script/imap_idle.rb"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackorum}}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-hackorum}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # IMAP ingest reads Identity rows whose tokens are AR-encrypted.
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q imap_idle.rb"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      autoheal: "true"

  imap_worker_local:
    build: ..
    logging: *logging-default
    command: ["bundle", "exec", "ruby", "script/imap_idle.rb"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackorum}}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-hackorum}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      IMAP_HOST: mailserver
      IMAP_PORT: "143"
      IMAP_SSL: "false"
      IMAP_USERNAME: ${RECEIVER_EMAIL:-receiver@hackorum.dev}
      IMAP_PASSWORD: ${RECEIVER_PASSWORD}
      IMAP_MAILBOX_LABEL: INBOX
    depends_on:
      db:
        condition: service_healthy
      mailserver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep -q imap_idle.rb"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      autoheal: "true"

  # The CI orchestrator: apply, push, ingest, forecast. Sole owner of the
  # ci_repo volume - it is the only process that fetches, and it runs the
  # hourly commit import itself (see bin/ci-repo-setup, deploy/README.md).
  orchestrator:
    build: ..
    logging: *logging-default
    env_file: .env
    entrypoint: ["./bin/orchestrator-entrypoint"]
    command: ["bin/orchestrator", "--repo", "/ci/repo", "--worktree", "/ci/worktree"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackorum}}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-hackorum}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # not read by this process (it touches no encrypted attributes), passed
      # for uniformity with the other app containers
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-warn}
      HACKORUM_GITHUB_TOKEN: ${HACKORUM_GITHUB_TOKEN}
      # the entrypoint's pre-flight check reads these, and so does
      # bin/orchestrator when it is invoked without the flags above - which is
      # what any `docker compose run/exec ... bin/orchestrator` does
      CI_REPO_DIR: /ci/repo
      CI_WORKTREE_DIR: /ci/worktree
      # commit import defaults for a manual run inside this container
      HACKORUM_PG_REPO: /ci/repo
      GIT_SSH_COMMAND: ssh -i /root/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    volumes:
      - ci_repo:/ci
      - ${HACKORUM_SSH_KEY:?set HACKORUM_SSH_KEY to the host path of the deploy key}:/run/hackorum_deploy_key:ro
    depends_on:
      db:
        condition: service_healthy
    # mtime of the file every cycle touches: a git call stalled with no timeout
    # leaves a live process and a frozen cycle, which a process check misses
    #
    # $$ here (unlike the single $ in the db healthcheck above) is on purpose:
    # we want the container's shell to see a literal $, not compose to
    # interpolate a var, so every $ is doubled to survive compose's parsing.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/orchestrator.heartbeat) )) -lt 600"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    labels:
      autoheal: "true"

  caddy:
    image: caddy:latest
    logging: *logging-verbose
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pgdumps:/dumps:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal
    logging: *logging-default
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  psql:
    image: postgres:18
    logging: *logging-default
    entrypoint: ["psql", "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hackorum}"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  pgdata:
  pgdumps:
  ci_repo:
  caddy_data:
  caddy_config:
  maildata:
  mailstate:
  maillogs:
