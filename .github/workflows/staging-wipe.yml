name: Staging wipe drill

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.STAGING_WIPE_DRILL == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -f environment=staging -f scope=wipe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
