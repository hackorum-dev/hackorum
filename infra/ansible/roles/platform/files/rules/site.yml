groups:
  - name: site
    rules:
      - alert: SiteProbeFailing
        expr: probe_success{job="blackbox_http"} == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.site }} https probe failing for 3m" }

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} cert expires in under 14 days" }

      - alert: SmtpBannerDown
        expr: probe_success{job="blackbox_smtp"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} smtp banner probe failing" }

      - alert: MailTlsPortDown
        expr: probe_success{job="blackbox_mail_tls"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.instance }} tls probe failing" }

      - alert: WebmailDown
        expr: probe_success{job="blackbox_webmail"} == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.instance }} webmail probe failing" }
