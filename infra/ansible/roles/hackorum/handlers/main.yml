- name: Hackorum restart postgres_exporter
  ansible.builtin.command:
    cmd: docker compose -f {{ hackorum_compose }} restart postgres_exporter
  changed_when: true
  when: not render_only

- name: Hackorum reload caddy
  ansible.builtin.command:
    cmd: docker compose -f {{ platform_root }}/compose/compose.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
  changed_when: true
  when: not render_only

# postfix-main.cf, dovecot.cf and friends are only read when the container is created
- name: Hackorum recreate mailserver
  ansible.builtin.command:
    cmd: docker compose -f {{ hackorum_compose }} up -d --force-recreate --wait mailserver
  changed_when: true
  when: not render_only
